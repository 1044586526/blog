<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系表单测试</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .contact-section {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .contact-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }
        .contact-info h3 {
            margin-bottom: 1rem;
            color: #2c3e50;
            font-size: 1.5rem;
        }
        .contact-info p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .contact-items {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #666;
            padding: 0.5rem 0;
        }
        .contact-item i {
            color: #3498db;
            width: 20px;
            font-size: 1.2rem;
        }
        .contact-form {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 15px;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
        }
        @media (max-width: 768px) {
            .contact-content {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="contact-section">
        <h2 style="text-align: center; color: #2c3e50; margin-bottom: 2rem;">联系表单测试</h2>
        
        <div class="contact-content">
            <div class="contact-info">
                <h3>让我们建立联系</h3>
                <p>我总是对新的机会和合作感兴趣。</p>
                <div class="contact-items">
                    <div class="contact-item">
                        <i class="fas fa-envelope"></i>
                        <span>contact@yicode.tech</span>
                    </div>
                    <div class="contact-item">
                        <i class="fab fa-github"></i>
                        <span>github.com/yicode</span>
                    </div>
                    <div class="contact-item">
                        <i class="fab fa-linkedin"></i>
                        <span>linkedin.com/in/yicode</span>
                    </div>
                </div>
            </div>
            
            <form class="contact-form" id="contact-form">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="您的姓名" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="您的邮箱" required>
                </div>
                <div class="form-group">
                    <textarea id="message" name="message" placeholder="您的留言" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn">发送消息</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('表单提交测试成功！');
        });
    </script>
</body>
</html>
