server:
  port: 8080

spring:
  application:
    name: portfolio-backend
  
  # Database Configuration (Local MySQL)
  datasource:
    url: jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false
  
  # Redis Configuration (Optional - will fallback if not available)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  
  # Mail Configuration (Disabled for local development)
  mail:
    host: localhost
    port: 25
    username: 
    password: 
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  
  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Logging Configuration
logging:
  level:
    tech.yicode.portfolio: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    root: INFO
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Custom Application Properties
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8081,http://127.0.0.1:5500,http://localhost:8080
  cache:
    ttl: 300 # 5 minutes for local development
  email:
    from: noreply@localhost
    admin: admin@localhost